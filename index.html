<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

    <title>FTW</title>
    <meta name="description" content="Your home's energy, from wherever you are." />

    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />

    <!-- Standalone display on iOS, and a status bar that blends into the
         app surface rather than sitting on a white strip. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="FTW" />
    <meta name="theme-color" content="#0d0d0d" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f4f4f2" media="(prefers-color-scheme: light)" />

    <!-- Resolve the theme before first paint. A flash of the wrong theme on
         every cold start is the most visible way to look like a web page
         rather than an app. Inline and synchronous on purpose. -->
    <script>
      ;(() => {
        try {
          const stored = localStorage.getItem('ftw.theme')
          const theme =
            stored === 'light' || stored === 'dark'
              ? stored
              : matchMedia('(prefers-color-scheme: light)').matches
                ? 'light'
                : 'dark'
          document.documentElement.dataset.theme = theme
        } catch {
          /* Private mode or blocked storage: the dark default already applies. */
        }
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
