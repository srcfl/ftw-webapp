name: CI

# Every push and every pull request. The suite is a few seconds; there is no
# reason to be selective about when it runs.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # contract/registry.yaml is one file that lives in two repositories, and only
  # a job with both checked out can tell whether it still is one file. The
  # file's own header has always said CI fails when the two drift; nothing ever
  # compared them, and they drifted three ways under a test that only ever
  # compared this repository against itself.
  #
  # Its own job rather than a step in verify, because it is the only thing here
  # that needs a second repository — and because a suite that cannot run on a
  # laptop should not be the reason `npm run verify` fails on one.
  contract:
    name: the registry and push catalogue have not drifted from the box
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # One file, not the box's whole history. A checkout that fails takes the
      # job with it, and the check refuses to run without both copies — so a
      # step deleted or a path renamed turns this red rather than green. That
      # is the entire difference between this and what it replaces.
      # A change that lands in both repositories at once cannot be compared
      # against the other one's default branch: the counterpart is not there
      # yet, and each side would wait for the other forever. A pull request
      # that names where its pair lives is compared against that instead.
      # Everything else — a stray edit, a rename, a copy someone forgot — still
      # meets the default branch, which is the case this job exists for.
      - name: Which copy of the box to compare against
        id: pair
        env:
          # Read live rather than from github.event: that payload is a snapshot
          # taken when the run was queued, so a pair declared after the last
          # push would be invisible and the job would compare against the wrong
          # branch while looking like it had worked.
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          BODY=""
          if [ -n "$PR_NUMBER" ]; then
            BODY=$(gh pr view "$PR_NUMBER" \
                     --repo "${{ github.repository }}" --json body -q .body)
          fi
          REF=$(printf '%s\n' "$BODY" | sed -n 's|^Contract-pair: *srcfl/ftw@||p' | head -1 | tr -d '\r')
          echo "ref=${REF:-master}" >> "$GITHUB_OUTPUT"
          echo "comparing against srcfl/ftw@${REF:-master}"

      - name: Check out the box
        uses: actions/checkout@v5
        with:
          repository: srcfl/ftw
          ref: ${{ steps.pair.outputs.ref }}
          path: .box
          token: ${{ secrets.FTW_CONTRACT_TOKEN || github.token }}
          # The registry, the push catalogue beside it, and the theme the
          # vendored components read their tokens from. Same names and same
          # bytes for the first two; same resolved values for the third.
          sparse-checkout: |
            contract/registry.yaml
            contract/push-catalogue.yaml
            web/components/theme.css
          sparse-checkout-cone-mode: false

      - run: node scripts/check-contract-drift.mjs .box/contract/registry.yaml
      - run: node scripts/check-token-drift.mjs .box/web/components/theme.css

  verify:
    runs-on: ubuntu-latest

    # No TZ set here on purpose. Local time is not decoration in this app —
    # the price window starts at local midnight, the publish hour is local,
    # and the day the chart draws is the local one — so the suite pins its own
    # zone in vitest.config.ts and runs the same on a UTC runner as on a
    # laptop. Setting one here would only hide it if the pin were removed.
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # Types, tests and a production build. The same command a person runs
      # before handing work over, so CI cannot pass where a laptop fails.
      - run: npm run verify

      # The privacy claims are tests, not prose, and a build that ships
      # without them passing is a build that ships a promise it has not
      # checked. Named explicitly so they can never be quietly skipped.
      - name: The relay learns nothing
        run: npx vitest run tests/relay-blindness.test.ts tests/end-to-end-encrypted.test.ts

      - name: Frame size does not track what happened in the house
        run: npx vitest run tests/relay-constant-shape.test.ts src/lib/protocol/frame.test.ts

      # The public demo ships on purpose, but it must stay behind import() so
      # no real home downloads it on launch. This test walks the production
      # manifest's static imports and also proves the demo is one dynamic
      # entry, available from the service worker only after someone asks.
      - name: Public demo stays out of the launch bundle
        run: npx vitest run tests/entry-bundle.test.ts

      # A budget, not a guideline. The first frame is the product, and a
      # bundle that grows without anyone noticing is how it stops being.
      - name: Bundle budget
        run: |
          BYTES=$(gzip -c dist/assets/index-*.js | wc -c | tr -d ' ')
          LIMIT=90000
          echo "entry bundle: ${BYTES} bytes gzip (limit ${LIMIT})"
          if [ "$BYTES" -gt "$LIMIT" ]; then
            echo "over budget — see docs/architecture.md on why the first frame matters"
            exit 1
          fi

      # The QR decoder is 47 kB gzip — half the budget again — and only Safari
      # needs it. It earns its place by being fetched when someone taps Scan,
      # so a static import that pulls it into the entry chunk is a regression
      # the byte count alone would not make obvious.
      - name: QR decoder stays out of the launch bundle
        run: |
          if ! ls dist/assets/jsQR-*.js >/dev/null 2>&1; then
            echo "no separate decoder chunk — it was inlined somewhere"
            exit 1
          fi
          # "binarize" is jsQR's own, not ours — grepping for a string we pass
          # in would match our call site, which lives in the entry bundle by
          # design and says nothing about where the library ended up.
          if grep -l "binarize" dist/assets/index-*.js >/dev/null 2>&1; then
            echo "the decoder reached the entry bundle; keep the import dynamic"
            exit 1
          fi
          echo "decoder is its own chunk: $(gzip -c dist/assets/jsQR-*.js | wc -c | tr -d ' ') bytes gzip, fetched on demand"

      # The price chart is 10.4 kB gzip against about 15 kB of headroom, so a
      # static import would pass the budget above while spending most of what
      # is left — on a screen many opens never reach. The comment in
      # Plan.svelte says it is fetched on demand; this is what makes that
      # comment true rather than a hope.
      - name: Price chart stays out of the launch bundle
        run: |
          if ! ls dist/assets/ftw-price-chart-*.js >/dev/null 2>&1; then
            echo "no separate chart chunk — it was inlined somewhere"
            exit 1
          fi
          # The component's own prose, not ours. Grepping for the element name
          # would match the tag in Plan.svelte's template, which lives in the
          # entry bundle by design and says nothing about where the component
          # ended up.
          if grep -l "Cheapest 2 h" dist/assets/index-*.js >/dev/null 2>&1; then
            echo "the chart reached the entry bundle; keep the import dynamic"
            exit 1
          fi
          echo "chart is its own chunk: $(gzip -c dist/assets/ftw-price-chart-*.js | wc -c | tr -d ' ') bytes gzip, fetched on demand"
