# FTW shared contract registry.
#
# The single source for every name shared between this app and the box, and
# the same file in both repositories — byte for byte.
#
# In srcfl/ftw it generates Go constants: go/protocol/contract_gen.go and
# go/internal/apiauth/contract_gen.go, from `go generate ./internal/...`.
# In srcfl/ftw-webapp there is no generator — src/lib/protocol/contract.ts and
# the error table in src/lib/protocol/messages.ts are written by hand and read
# back against this file by tests/registry-contract.test.ts.
#
# The two copies are compared in CI on both sides: the app runs
# scripts/check-contract-drift.mjs against a checkout of the box, and the box's
# test workflow runs the same comparison against a checkout of the app. Neither
# passes when the other repository is missing. Change one copy and change the
# other in the same pair of pull requests.
#
# Never hand-write one of these names in either language. Three separate
# namespaces for authorisation already exist in the codebase; this file is
# what stops that from happening again.
#
# One YAML trap, learned the hard way: a `desc` is a flow-mapping value, so an
# unquoted comma ends it. Go read `Route replaces a whole document, not part of
# one` as `Route replaces a whole document` and generated a truncated comment
# while the app's line-based reader saw the whole sentence. Keep commas out of
# a desc, or quote it.

version: 1

# ---------------------------------------------------------------------------
# Frozen field ids. Permanent as of v1 — an app of any age can draw the core
# view from these alone. Freezing them now is free. Adding to the frozen set
# later is not, so think before extending.
# ---------------------------------------------------------------------------
frozen_fields:
  1: { name: mode, kind: enum, unit: null }
  2: { name: grid_w, kind: power, unit: W }
  3: { name: pv_w, kind: power, unit: W }
  4: { name: battery_w, kind: power, unit: W }
  5: { name: battery_soc, kind: ratio, unit: permille }
  6: { name: load_w, kind: power, unit: W }
  7: { name: src_grid, kind: source_ref, unit: null }
  8: { name: src_pv, kind: source_ref, unit: null }
  9: { name: src_battery, kind: source_ref, unit: null }
  # Frozen means the id's meaning never changes — not that the field is
  # always present. Like battery_soc, ev_w is sent only when the box has
  # a charger to measure; a site without one sends nothing, and the app
  # draws no EV node rather than a dead one. Positive while charging,
  # by the site convention: the charger consumes like any other load.
  10: { name: ev_w, kind: power, unit: W }

# ---------------------------------------------------------------------------
# Field ids after the frozen set. They travel like the frozen ids, in lane
# 0's delta and in FTW Cloud's live body, under the same rules: integers,
# sent only while the box has the reading, and an id never changes meaning.
# They are depth for a node's own view, not the core view, so an app draws
# Now without them and a box may stop sending one. Lane 0 drops the highest
# id first when a delta does not fit its bucket, so these give way first.
#
# The grid's phase currents come from the site meter in tenths of an ampere,
# signed by the site convention: positive while the phase draws from the
# grid. A meter that gives magnitudes and no power per phase sends positive
# values both ways, so a positive current alone does not prove import. The
# box sends only the phases the site has, each while the meter is online and
# reports it, and their freshness is the grid meter's. grid_fuse_da is the
# main fuse per phase from the box's config, sent with the phases as their
# scale.
# ---------------------------------------------------------------------------
extra_fields:
  11: { name: grid_l1_da, kind: current, unit: dA }
  12: { name: grid_l2_da, kind: current, unit: dA }
  13: { name: grid_l3_da, kind: current, unit: dA }
  14: { name: grid_fuse_da, kind: current, unit: dA }

# ---------------------------------------------------------------------------
# Capabilities. A set of names, not version numbers. Absent means the box does
# not have it; the UI hides the feature and never crashes.
# ---------------------------------------------------------------------------
capabilities:
  - status.core
  - status.phases
  - status.drivers
  - history.5m
  - history.1h
  - history.etag
  - cmd.lease
  - cmd.precondition
  - cmd.readback
  - der.battery
  - der.ev
  - der.v2x
  - plan.dispatch
  - net.webrtc
  # Electricity prices, when the box has a zone configured and rows stored.
  # Absent means the app draws no price view rather than an empty one.
  - price.spot
  # The box's own HTTP API, carried over the session. Absent means the app
  # hides every view that needs it and never crashes — the same rule as
  # history.5m. Present does not mean every path is reachable: reads and
  # configuration go through, anything that moves energy stays on cmd.
  - api.passthrough
  # The box can run the FTW Cloud uplink. Absent means the app uses the relay
  # only and offers no FTW Cloud. It says nothing about whether the owner
  # turned FTW Cloud on; the box's grant decides that.
  - cloud.link
  # The box takes its app session through FTW Cloud, end to end, as `tun`
  # (docs/protocol-cloud.md, Tunnel, in srcfl/ftw). Absent means a phone
  # reaches the box through the relay, even when it knows the home id.
  - cloud.tun
  # The box can take a watch: it opens the relay's exchange socket and mints
  # watch codes. Absent means the phone offers no Add watch. The wire is
  # docs/watch-exchange.md in srcfl/ftw-webapp.
  - cmd.exchange
  # The box takes agents: assistants, Sourceful support and the release
  # check, each an owner's grant with scopes, ops, caps and an expiry, and it
  # answers the agent.* messages and approval.key.set (docs/agents.md in
  # srcfl/ftw). Absent means the app offers no Access list.
  - access.agents

# ---------------------------------------------------------------------------
# Scopes. One object axis and a verb: <object>.<read|write|run|hold|request>.
# read and write are a phone's. run changes nothing, hold acts for a capped
# time and ends unless renewed, and request waits for an owner to confirm.
# Roles are a UI projection over these, never a replacement for them.
# ---------------------------------------------------------------------------
scopes:
  - { name: ftw.live.read, desc: Current readings and freshness }
  - { name: ftw.history.read, desc: Stored history }
  - { name: ftw.plan.read, desc: Dispatch plan and its reasoning }
  - { name: ftw.health.read, desc: Box and driver health }
  - { name: ftw.assets.read, desc: Devices and their capabilities }
  - { name: ftw.events.read, desc: Events behind notifications }
  - { name: ftw.dispatch.write, desc: Control energy assets }
  - { name: ftw.mode.write, desc: Change site operating mode }
  - { name: ftw.members.read, desc: See who has access }
  - { name: ftw.members.write, desc: Invite and revoke }
  - { name: ftw.logs.read, desc: Log excerpts the box redacts }
  - { name: ftw.config.read, desc: Configuration the box redacts }
  - { name: ftw.diag.run, desc: Checks that change nothing }
  - { name: ftw.dispatch.hold, desc: Hold energy assets for a capped time }
  - { name: ftw.goals.request, desc: Ask an owner to change a durable goal }
  # Reserved: no op asks for an update yet, and no role but owner carries it.
  - { name: ftw.update.request, desc: Ask an owner to install a version }

roles:
  owner:
    label: Owner
    scopes: ['*']
  viewer:
    label: Viewer
    scopes: [ftw.live.read]
  # A watch that an owner phone added. That phone is its parent, and each check
  # keeps only the scopes below that the parent holds at that moment, so a
  # watch never does more than its phone can do now. Read and charge: no site
  # mode, no members, no history and no passthrough.
  watch:
    label: Watch
    scopes: [ftw.live.read, ftw.plan.read, ftw.events.read, ftw.dispatch.write]
  # Agents: grants an owner gives to something other than a paired device.
  # A role here is the most a grant of that kind may carry. Each grant names
  # a subset, and each check keeps only what the approving owner holds at
  # that moment, as for a watch. An agent reaches the box only through FTW
  # Cloud's tunnel. See docs/agents.md in srcfl/ftw.
  #
  # agent is a personal assistant. support is Sourceful for one ticket. release
  # is the release check, which reads a health summary and nothing else.
  agent:
    label: Assistant
    scopes: [ftw.live.read, ftw.history.read, ftw.plan.read, ftw.health.read, ftw.events.read, ftw.logs.read, ftw.config.read, ftw.diag.run, ftw.dispatch.hold, ftw.goals.request]
  support:
    label: Sourceful support
    scopes: [ftw.live.read, ftw.history.read, ftw.plan.read, ftw.health.read, ftw.events.read, ftw.logs.read, ftw.config.read, ftw.diag.run, ftw.dispatch.hold, ftw.goals.request]
  release:
    label: Release check
    scopes: [ftw.health.read]

# ---------------------------------------------------------------------------
# FTW Cloud. What an owner can let the box share with FTW Cloud, and why.
# docs/protocol-cloud.md in srcfl/ftw is the wire format.
#
# cloud_scopes are the scopes a grant may name: the box sends a class only
# when the grant holds its scope, and a device reads it only when its own
# role carries the scope too. ftw.assets.read is left out on purpose: the
# box sends no device inventory, names or capabilities to FTW Cloud.
#
# cloud_purposes are what the data may be used for. serve is the owner's own
# phones and widgets. stats is household statistics, a separate consent that
# is off unless the owner turns it on.
# ---------------------------------------------------------------------------
cloud_scopes: [ftw.live.read, ftw.history.read, ftw.plan.read, ftw.health.read, ftw.events.read]
cloud_purposes: [serve, stats]

# ---------------------------------------------------------------------------
# Command operations. What a `cmd` frame may name, and the scope the grant
# must carry before the box acts on it.
#
# The box's own table — defaultOps() in go/internal/appproto/command.go — is
# the authority on what a given box accepts. The pair is copied here because
# both sides used to hand-write it: the box beside its dispatcher, the app in
# its simulator, and nothing compared the two. An op declared here that a box
# does not implement is answered with E_UNKNOWN_OP like any other stranger —
# battery.hold is the app's vocabulary today and no shipping box acts on it
# yet.
#
# agent is the scope that opens the op to an agent, and its verb says how.
# ftw.dispatch.hold runs now as a cmd, within the grant's caps, and must end
# by itself. ftw.goals.request never runs as a cmd: it waits as an
# agent.request until an owner confirms it. An op without agent is never
# open to an agent. battery.hold and loadpoint.boost have none until the box
# can bound them: battery.hold has no handler yet, and a boost has no power
# of its own to hold to maxW. agent_args below says what an agent may send.
# ---------------------------------------------------------------------------
ops:
  - { name: site.mode.set, scope: ftw.mode.write, agent: ftw.goals.request, desc: Change the site operating mode }
  - { name: planner.prefs.set, scope: ftw.mode.write, agent: ftw.goals.request, desc: Set household planner preferences }
  - { name: battery.hold, scope: ftw.dispatch.write, desc: Hold the battery at a fixed setpoint }
  - { name: loadpoint.hold, scope: ftw.dispatch.write, agent: ftw.dispatch.hold, desc: Charge the car now at a fixed current }
  - { name: loadpoint.boost, scope: ftw.dispatch.write, desc: Boost the car from the house battery }
  - { name: loadpoint.soc.set, scope: ftw.dispatch.write, agent: ftw.goals.request, desc: Correct the car's current charge level }
  - { name: loadpoint.surplus_only.set, scope: ftw.dispatch.write, agent: ftw.goals.request, desc: Charge the car from surplus PV only }

# ---------------------------------------------------------------------------
# Dispatch modes.
#
# These keys are FTW's, from control.AllModes() in go/internal/control/
# dispatch.go. They are copied here so the app can validate and translate
# them — not so the app can decide what exists.
#
# The box is the authority: it sends its own catalogue (key, label, tooltip,
# tier) and the app renders that. A mode listed here gets our own wording; a
# mode we have never heard of still appears, using the box's label. That is
# what lets a newer box ship a new strategy without waiting for an app
# release, and it is the same degrade-don't-die rule as capabilities.
#
# tier decides placement, not permission:
#   primary  — forecast-driven strategies; the Plan card sets them through household prefs, not buttons
#   advanced — manual fallbacks, behind "Manual…"
#   hidden   — valid over the API but never rendered as a button
# ---------------------------------------------------------------------------
modes:
  - { key: planner_passive_arbitrage, tier: primary }
  - { key: planner_arbitrage, tier: primary }
  - { key: idle, tier: advanced }
  - { key: self_consumption, tier: advanced }
  - { key: peak_shaving, tier: advanced }
  - { key: charge, tier: advanced }
  - { key: planner_self, tier: hidden }
  - { key: planner_cheap, tier: hidden }

# ---------------------------------------------------------------------------
# Error codes the box sends. The box sends the code and args; this app owns all
# prose. retryable tells the client whether to offer a retry at all.
# ---------------------------------------------------------------------------
errors:
  - { code: E_BOOTING, retryable: true, desc: Box is starting up }
  - { code: E_UNKNOWN_OP, retryable: false, desc: Message type not understood }
  - { code: E_CMD_EXPIRED, retryable: false, desc: Command outlived not_valid_after_ms }
  - { code: E_PRECONDITION, retryable: false, desc: Guard failed against fresh state }
  - { code: E_CONFLICT, retryable: true, desc: expect.rev did not match }
  - { code: E_SCOPE_DENIED, retryable: false, desc: Grant lacks the required scope }
  - { code: E_GRANT_REVOKED, retryable: false, desc: Access was withdrawn }
  - { code: E_LAST_OWNER_PROTECTED, retryable: false, desc: Cannot remove the only owner }
  - { code: E_RANGE_TOO_LARGE, retryable: false, desc: History window exceeds the limit }
  - { code: E_UNAVAILABLE, retryable: true, desc: Source or subsystem is down }
  # The passthrough's refusals. Each is a different sentence to a user, which
  # is why none of them reuses a code above: a shared name that means two
  # things is what this file exists to prevent.
  #
  # E_NEEDS_STEP_UP is the one retryable refusal here, and it is retryable
  # because the very same request goes through once the passkey ceremony has
  # run — the box refuses on `!req.StepUp` alone and the app sends it again
  # itself. The others are the box's answer about the route, and asking a
  # second time gets the same answer.
  - { code: E_NEEDS_STEP_UP, retryable: true, desc: Request needs a fresh passkey ceremony }
  - { code: E_USE_CMD, retryable: false, desc: Route moves energy and belongs on cmd }
  - { code: E_UNSUPPORTED_MEDIA, retryable: false, desc: Answer is not a kind the session carries }
  - { code: E_WHOLE_DOCUMENT, retryable: false, desc: Route replaces a whole document rather than part of one }
  # A route the session does not carry at all: its answer holds a credential,
  # or doing it needs somebody standing at the box. Not a permission the owner
  # is missing, so neither a role nor a ceremony changes the answer.
  - { code: E_LOCAL_ONLY, retryable: false, desc: Route is served only on the box's own page }
  # Agents' refusals (docs/agents.md in srcfl/ftw). Each is a different
  # sentence to an owner reading the audit log or an assistant reading its
  # answer, so none reuses a code above.
  #
  # E_RATE_LIMITED is retryable because the same command goes through once
  # the grant's minute has room. E_CAP_EXCEEDED is not: the box refuses an
  # argument past a cap rather than clipping it, and the same argument gets
  # the same answer.
  - { code: E_GRANT_EXPIRED, retryable: false, desc: Access ran out at its expiry }
  - { code: E_OP_NOT_GRANTED, retryable: false, desc: The grant does not list this operation }
  - { code: E_CAP_EXCEEDED, retryable: false, desc: An argument or a count is past its cap }
  - { code: E_RATE_LIMITED, retryable: true, desc: Too many commands for the grant's rate }
  - { code: E_NEEDS_OWNER, retryable: false, desc: A durable change waits for an owner as agent.request }
  - { code: E_BAD_SIGNATURE, retryable: false, desc: The approval signature is missing or does not verify }
  - { code: E_NO_APPROVAL_KEY, retryable: false, desc: This phone has no approval key on the box }
  - { code: E_NOT_FOUND, retryable: false, desc: Nothing by that id or name }
  # An approval whose atMs is too far from the box's wall clock. args.boxMs
  # is the box's clock, so the phone can sign again with the right time.
  - { code: E_CLOCK_SKEW, retryable: true, desc: The approval's time is too far from the box's }

# ---------------------------------------------------------------------------
# Error codes the client raises for itself.
#
# These never cross the wire. The box generates nothing from this block and
# must never send one of them; the app raises them locally and they meet the
# same prose and retry rules as everything above.
#
# They are written down here rather than in the app alone because the app's
# error table is checked against this file in full. A code with no home here
# would need an exemption in that check, and an exemption list is exactly the
# thing this file exists to avoid.
# ---------------------------------------------------------------------------
client_errors:
  # A cut-off answer is not an error on the wire: by the time the box knows it
  # has run out of room, a status has gone out and the app is committed to it,
  # so the box reports it as `truncated: true` on api.end. The app turns that
  # into a code because half a document is not an answer and a view needs one
  # thing to catch.
  - { code: E_RESPONSE_TOO_LARGE, retryable: false, desc: The answer arrived cut off }
  # The session's own command deadlines. No ack inside the window — or the
  # carrier closed with the command still unacknowledged — means the box never
  # took the intent, so asking again cannot make anything happen twice.
  - { code: E_NO_ACK, retryable: true, desc: The command was never acknowledged }
  # The wire went away or the deadline passed before any status arrived. The
  # session reconnects on its own, so the same request can simply be asked
  # again.
  - { code: E_NO_ANSWER, retryable: true, desc: The request got no answer at all }
  # An answer this app could not read: a body that is not the JSON it claimed
  # to be, or one that contradicts what was asked. The box and the app
  # disagree about a route, and asking again gets the same answer.
  - { code: E_BAD_BODY, retryable: false, desc: The answer could not be read }

# ---------------------------------------------------------------------------
# Source states. Orthogonal to carrier state — see docs/protocol.md. Merging
# the two into one enum cannot express "connected, but the inverter is quiet".
# ---------------------------------------------------------------------------
source_states: [live, lagging, stale, down, never]
# tunnel is the box's own session carried by FTW Cloud, which cannot read it.
# cloud is the box-signed copy FTW Cloud holds and can read.
carrier_states: [webrtc, relay, tunnel, cloud, cache, none]

# ---------------------------------------------------------------------------
# History resolutions backed by what the box actually stores.
# ---------------------------------------------------------------------------
resolutions:
  '5m': { tile_span_ms: 43200000, retention_days: 30, source: energy_ledger }
  '1h': { tile_span_ms: 604800000, retention_days: 730, source: hourly_rollup }

# ---------------------------------------------------------------------------
# What an agent may put in each op it can name (docs/agents.md in srcfl/ftw,
# Operations). The box refuses any other key, a value of another kind and one
# outside its range, in a cmd and in an agent.request, as it arrives. label is
# the words the app shows an owner for the value. cap names the grant's cap
# that bounds it as well. kind says how to read the value:
#   loadpoint  the opaque charger id the agent read from loadpoints.get
#   mode       a key in modes
#   enum       one of values
#   number, power, duration   a number in unit
#   ratio      a fraction from 0 to 1
#   bool       true or false
# ---------------------------------------------------------------------------
agent_args:
  site.mode.set:
    - { name: mode, kind: mode, required: true, label: Operating mode }
  planner.prefs.set:
    - { name: safety_k, kind: number, min: 0, max: 2, label: How cautious the plan is }
    - { name: battery_export, kind: enum, values: [unknown, not_allowed, allowed], label: Whether the battery may sell to the grid }
  loadpoint.hold:
    - { name: id, kind: loadpoint, required: true, label: Charger }
    - { name: power_w, kind: power, unit: W, min: 0, cap: maxW, label: Charging power }
    - { name: hold_s, kind: duration, unit: s, min: 1, cap: holdS, label: For how long }
    - { name: phase_mode, kind: enum, values: [auto, 1p, 3p], label: Phases }
    - { name: clear, kind: bool, label: Stop the agent's own hold }
  loadpoint.soc.set:
    - { name: id, kind: loadpoint, required: true, label: Charger }
    - { name: soc, kind: ratio, required: true, min: 0, max: 1, label: The car's charge level }
  loadpoint.surplus_only.set:
    - { name: id, kind: loadpoint, required: true, label: Charger }
    - { name: surplus_only, kind: bool, required: true, label: Charge from solar only }

# ---------------------------------------------------------------------------
# Reads an agent may send, and the scope each needs (docs/agents.md in
# srcfl/ftw, Reads). Their answers name nothing: sources, chargers and cars
# go by opaque ids the box cuts with a key of its own. An agent has no sub;
# live.get is its view of now. A phone may send these too, under the same
# scope.
# ---------------------------------------------------------------------------
reads:
  - { msg: live.get, scope: ftw.live.read, desc: Readings and freshness now }
  - { msg: loadpoints.get, scope: ftw.live.read, desc: Each charger and the car on it }
  - { msg: cars.get, scope: ftw.live.read, desc: Each car's level and goal }
  - { msg: plan.get, scope: ftw.plan.read, desc: The plan and its reasons }
  - { msg: price.get, scope: ftw.plan.read, desc: Electricity prices }
  - { msg: hist.query, scope: ftw.history.read, desc: Stored history }
  - { msg: health.get, scope: ftw.health.read, desc: The health summary }
  - { msg: drivers.get, scope: ftw.health.read, desc: Each driver's state }
  - { msg: events.get, scope: ftw.events.read, desc: Recent events }
  - { msg: logs.get, scope: ftw.logs.read, desc: A log excerpt the box redacts }
  - { msg: config.get, scope: ftw.config.read, desc: A configuration section the box redacts }
  - { msg: diag.run, scope: ftw.diag.run, desc: A check that changes nothing }
