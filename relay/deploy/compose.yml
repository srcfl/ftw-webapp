# The relay and its TLS terminator, on one small instance.
#
# Deliberately two containers and no more. There is no database: rooms live in
# memory and die with their last socket, while one volume holds sealed dead-man
# rows and bounded daily fleet totals. That is also
# why a single instance is the right shape — a box and its phones must land on
# the same process, and sharding would need the handle to reach a load
# balancer, which is exactly the identifier the design keeps from it.

name: ftw-relay

services:
  relay:
    build:
      context: ../..
      dockerfile: relay/Dockerfile
    restart: unless-stopped
    # Loopback only. Caddy is the only thing that may reach it, which is what
    # makes trusting the forwarded header safe.
    ports:
      - '127.0.0.1:8787:8787'
    environment:
      PORT: '8787'
      HOST: '0.0.0.0'
      # Read X-Forwarded-For. True only because Caddy is in front on loopback;
      # exposed directly this would let a client choose its own rate-limit slot.
      RELAY_TRUST_PROXY: '1'
      # The dead man rows and anonymous daily fleet totals share the one state
      # volume. Fleet request bodies and source addresses are never written.
      RELAY_DEADMAN_PATH: /state/deadman.json
      RELAY_FLEET_STATS_PATH: /state/fleet-stats.json
      # Optional. When both exist, the relay sends aggregate process counters
      # and daily fleet totals. It never sends handles, addresses or frames.
      RELAY_STATS_EXPORT_URL: ${RELAY_STATS_EXPORT_URL:-}
      RELAY_STATS_EXPORT_SECRET: ${RELAY_STATS_EXPORT_SECRET:-}
    volumes:
      - relay-state:/state
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
      - caddy-logs:/var/log/caddy
    depends_on:
      - relay

volumes:
  caddy-data:
  caddy-config:
  caddy-logs:
  relay-state:
